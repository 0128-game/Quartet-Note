<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d0f1d;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        #control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1a1d33;
            padding: 10px 20px;
            border-bottom: 2px solid #2a2e45;
            z-index: 30;
        }

        .panel-section {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            background-color: #0b0c16;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            width: 250px;
        }

        button {
            background-color: #2e3456;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover {
            background-color: #3e4675;
        }

        button.active {
            background-color: #00ffff;
            color: #000;
            box-shadow: 0 0 10px #00ffff;
        }

        #game-area {
            flex: 1;
            position: relative;
            width: 100%;
            background-color: #05050a;
            display: flex;
            justify-content: center;
        }

        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.25;
            pointer-events: none;
            transition: opacity 0.3s, z-index 0.1s;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
        }

        #game-lanes {
            position: relative;
            width: 400px;
            height: 100%;
            background-color: rgba(16, 18, 35, 0.75);
            border-left: 3px solid #2a2e45;
            border-right: 3px solid #2a2e45;
            display: flex;
            z-index: 2;
        }

        .lane {
            flex: 1;
            position: relative;
            height: 100%;
            border-right: 1px solid rgba(42, 46, 69, 0.5);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .lane:last-child {
            border-right: none;
        }

        .lane-key-guide {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.3);
            z-index: 10;
        }

        .lane.active-tap {
            background: linear-gradient(to top, rgba(0, 255, 255, 0.2), rgba(0, 255, 255, 0));
        }

        #judgment-line {
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: #ff007f;
            box-shadow: 0 0 10px #ff007f;
            z-index: 4;
            pointer-events: none;
        }

        .note {
            position: absolute;
            width: 90%;
            left: 5%;
            height: 12px;
            border-radius: 6px;
            transform: translateY(-50%);
            z-index: 6;
        }

        .note-tap {
            background: linear-gradient(to right, #00ffff, #ffffff, #00ffff);
            box-shadow: 0 0 12px #00ffff;
        }

        .note-slide {
            background: linear-gradient(to right, #ffee00, #ffffff, #ffee00);
            box-shadow: 0 0 12px #ffee00;
        }

        .long-note-body {
            position: absolute;
            width: 100%;
            left: 0;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0, 255, 180, 0.6), rgba(0, 180, 255, 0.6));
            border-left: 2px solid #00ffff;
            border-right: 2px solid #00ffff;
            pointer-events: none;
        }

        #ui-overlay {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 15;
        }

        #score-display {
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
        }

        #combo-display {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.6);
            margin-bottom: 10px;
            font-style: italic;
        }

        #judgment-display {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            text-shadow: 0 0 10px currentColor;
            transition: transform 0.05s ease-out;
        }

        .jd-perfect { color: #ffee00; }
        .jd-great   { color: #ff00ff; }
        .jd-good    { color: #00ffff; }
        .jd-miss    { color: #888888; }

        .hidden {
            display: none !important;
        }

        #editor-panel {
            background-color: #111322;
            border-top: 2px solid #2a2e45;
            padding: 15px;
            height: 180px;
            z-index: 30;
            overflow-y: hidden;
            overflow-x: auto;
        }

        #editor-panel h3 {
            font-size: 14px;
            color: #8b92b5;
            margin-bottom: 10px;
        }

        #timeline-container {
            width: 100%;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="control-panel">
            <div class="panel-section">
                <input type="text" id="youtube-url" placeholder="YouTubeのURLまたは動画IDを入力">
                <button id="btn-load">読み込み</button>
            </div>
            <div class="panel-section">
                <button id="btn-mode-play" class="active">プレイ</button>
                <button id="btn-mode-record">録音</button>
                <button id="btn-mode-edit">編集</button>
                <button id="btn-toggle-bg">プレイヤー: 背景</button>
            </div>
            <div class="panel-section">
                <button id="btn-save-json">JSON保存</button>
                <input type="file" id="file-load-json" style="display:none;" accept=".json">
                <button id="btn-load-json" onclick="document.getElementById('file-load-json').click()">JSON読込</button>
            </div>
        </div>

        <div id="game-area">
            <div id="video-container">
                <div id="youtube-player"></div>
            </div>

            <div id="game-lanes">
                <div id="judgment-line"></div>
                <div class="lane" id="lane-0"><span class="lane-key-guide">D</span></div>
                <div class="lane" id="lane-1"><span class="lane-key-guide">F</span></div>
                <div class="lane" id="lane-2"><span class="lane-key-guide">J</span></div>
                <div class="lane" id="lane-3"><span class="lane-key-guide">K</span></div>
            </div>

            <div id="ui-overlay">
                <div id="score-display">SCORE: 0000000</div>
                <div id="combo-display" class="hidden">0 COMBO</div>
                <div id="judgment-display"></div>
            </div>
        </div>

        <div id="editor-panel" class="hidden">
            <h3>タイムラインエディタ (ノーツ時間調整)</h3>
            <div id="timeline-container"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        /* ==========================================
           【データ＆オーディオ管理機構 (旧audio.js分)】
           ========================================== */
        window.GameAudio = {
            player: null,
            isReady: false,
            isRecording: false,
            notesData: [], // 譜面データ配列

            init() {
                // YouTube URLの読み込みボタンイベント
                const btnLoad = document.getElementById('btn-load');
                if (btnLoad) {
                    btnLoad.addEventListener('click', () => {
                        const urlInput = document.getElementById('youtube-url').value;
                        const videoId = this.extractVideoId(urlInput);
                        if (videoId) {
                            this.loadVideo(videoId);
                        } else {
                            alert('有効なYouTubeのURLまたは動画IDを入力してください。');
                        }
                    });
                }

                // JSONセーブ・ロード機能
                const btnSaveJson = document.getElementById('btn-save-json');
                if (btnSaveJson) {
                    btnSaveJson.addEventListener('click', () => this.saveNotesAsJson());
                }

                const fileLoadJson = document.getElementById('file-load-json');
                if (fileLoadJson) {
                    fileLoadJson.addEventListener('change', (e) => this.loadNotesFromJson(e));
                }
            },

            extractVideoId(url) {
                if (!url) return null;
                if (url.length === 11) return url; // 直接IDが入力された場合
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            },

            loadVideo(videoId) {
                if (this.player && typeof this.player.loadVideoById === 'function') {
                    this.player.loadVideoById(videoId);
                } else {
                    // プレイヤーがまだ生成されていない場合は新規作成
                    this.player = new YT.Player('youtube-player', {
                        videoId: videoId,
                        playerVars: {
                            'autoplay': 0,
                            'controls': 1,
                            'disablekb': 1,
                            'fs': 0,
                            'rel': 0,
                            'showinfo': 0
                        },
                        events: {
                            'onReady': () => { this.isReady = true; },
                            'onStateChange': (e) => {
                                // 再生開始時にプレイモードならゲーム側のリセットをかける
                                if (e.data === YT.PlayerState.PLAYING && window.GameCore.currentMode === 'play') {
                                    if (window.GameCore.isResultShown) {
                                        window.GameCore.resetLive();
                                    }
                                }
                            }
                        }
                    });
                }
            },

            getCurrentTimeMs() {
                if (this.player && typeof this.player.getCurrentTime === 'function') {
                    return Math.floor(this.player.getCurrentTime() * 1000);
                }
                return 0;
            },

            play() {
                if (this.player && typeof this.player.playVideo === 'function') this.player.playVideo();
            },

            pause() {
                if (this.player && typeof this.player.pauseVideo === 'function') this.player.pauseVideo();
            },

            saveNotesAsJson() {
                if (this.notesData.length === 0) {
                    alert('保存するノーツデータがありません。');
                    return;
                }
                const cleanData = this.notesData.map(n => ({ time: n.time, lane: n.lane, type: n.type }));
                const blob = new Blob([JSON.stringify(cleanData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'chart.json';
                a.click();
                URL.revokeObjectURL(url);
            },

            loadNotesFromJson(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        this.notesData = parsed.map(n => ({
                            time: parseInt(n.time),
                            lane: parseInt(n.lane),
                            type: n.type,
                            judged: false,
                            holdStarted: false
                        }));
                        this.notesData.sort((a, b) => a.time - b.time);
                        alert(`譜面データを読み込みました (${this.notesData.length} ノーツ)`);
                        if (window.GameVisuals) window.GameVisuals.updateTimeline();
                        if (window.GameCore) window.GameCore.resetLive();
                    } catch (err) {
                        alert('JSONファイルの読み込みに失敗しました。形式を確認してください。');
                    }
                };
                reader.readAsText(file);
            }
        };

        // YouTube Iframe API が読み込まれた際に自動で呼ばれる関数
        function onYouTubeIframeAPIReady() {
            window.GameAudio.init();
        }

        /* ==========================================
           【ゲームメインロジック (GameCore)】
           ========================================== */
        if (typeof window.GameCore === 'undefined') {
            window.GameCore = {
                currentMode: 'play', 
                score: 0,
                combo: 0,
                maxCombo: 0,
                noteSpeedMs: 1000, 
                
                judgments: {
                    perfect: 40,
                    great: 80,
                    good: 130,
                    miss: 200
                },

                keyMap: { 'd': 0, 'f': 1, 'j': 2, 'k': 3 },
                
                pressTimestamps: { 0: null, 1: null, 2: null, 3: null }, 
                isKeyHolding: { 0: false, 1: false, 2: false, 3: false }, 

                isBgVisible: true, 
                counts: { perfect: 0, great: 0, good: 0, miss: 0 },
                isResultShown: false,

                init() {
                    this.setupEventListeners();
                    this.startGameLoop();
                },

                setupEventListeners() {
                    const btnPlay = document.getElementById('btn-mode-play');
                    const btnRecord = document.getElementById('btn-mode-record');
                    const btnEdit = document.getElementById('btn-mode-edit');
                    const btnToggleBg = document.getElementById('btn-toggle-bg');

                    if (btnPlay) btnPlay.addEventListener('click', () => this.switchMode('play'));
                    if (btnRecord) btnRecord.addEventListener('click', () => this.switchMode('record'));
                    if (btnEdit) btnEdit.addEventListener('click', () => this.switchMode('edit'));
                    if (btnToggleBg) btnToggleBg.addEventListener('click', () => this.toggleBackground());

                    window.addEventListener('keydown', (e) => {
                        if (e.repeat) return; // 長押し自動連打ガード
                        const key = e.key.toLowerCase();
                        if (e.key === ' ') {
                            e.preventDefault();
                            this.togglePlayback();
                            return;
                        }
                        if (this.isBgVisible && this.keyMap.hasOwnProperty(key)) {
                            const lane = this.keyMap[key];
                            if (!this.isKeyHolding[lane]) {
                                this.isKeyHolding[lane] = true;
                                this.handlePressStart(lane);
                            }
                        }
                    });

                    window.addEventListener('keyup', (e) => {
                        const key = e.key.toLowerCase();
                        if (this.isBgVisible && this.keyMap.hasOwnProperty(key)) {
                            const lane = this.keyMap[key];
                            this.isKeyHolding[lane] = false;
                            this.handlePressEnd(lane);
                        }
                    });

                    // タッチ・マウス操作対応
                    for (let i = 0; i < 4; i++) {
                        const laneEl = document.getElementById(`lane-${i}`);
                        if (!laneEl) continue;
                        const startEvent = 'ontouchstart' in window ? 'touchstart' : 'mousedown';
                        const endEvent = 'ontouchstart' in window ? 'touchend' : 'mouseup';

                        laneEl.addEventListener(startEvent, (e) => {
                            if (!this.isBgVisible) return;
                            e.preventDefault();
                            if (!this.isKeyHolding[i]) {
                                this.isKeyHolding[i] = true;
                                this.handlePressStart(i);
                            }
                        });
                        laneEl.addEventListener(endEvent, (e) => {
                            if (!this.isBgVisible) return;
                            e.preventDefault();
                            this.isKeyHolding[i] = false;
                            this.handlePressEnd(i);
                        });
                        laneEl.addEventListener('mouseleave', (e) => {
                            if (this.isKeyHolding[i]) {
                                this.isKeyHolding[i] = false;
                                this.handlePressEnd(i);
                            }
                        });
                    }
                },

                toggleBackground() {
                    const videoContainer = document.getElementById('video-container');
                    const btnToggleBg = document.getElementById('btn-toggle-bg');
                    if (!videoContainer || !btnToggleBg) return;
                    this.isBgVisible = !this.isBgVisible;
                    if (this.isBgVisible) {
                        videoContainer.style.zIndex = '1'; videoContainer.style.opacity = '0.25'; videoContainer.style.pointerEvents = 'none';
                        btnToggleBg.textContent = 'プレイヤー: 背景'; btnToggleBg.style.backgroundColor = '';
                    } else {
                        videoContainer.style.zIndex = '20'; videoContainer.style.opacity = '1'; videoContainer.style.pointerEvents = 'auto';
                        btnToggleBg.textContent = 'プレイヤー: 前面'; btnToggleBg.style.backgroundColor = '#ff007f';
                    }
                },

                togglePlayback() {
                    if (!window.GameAudio || !window.GameAudio.player) return;
                    try {
                        if (window.GameAudio.player.getPlayerState() === 1) window.GameAudio.pause();
                        else window.GameAudio.play();
                    } catch (e) { window.GameAudio.play(); }
                },

                handlePressStart(lane) {
                    const currentTime = window.GameAudio ? window.GameAudio.getCurrentTimeMs() : Date.now();
                    this.pressTimestamps[lane] = currentTime;
                    const laneEl = document.getElementById(`lane-${lane}`);
                    if (laneEl) laneEl.classList.add('active-tap');
                    if (this.currentMode === 'play') this.judgeOnPress(lane, currentTime);
                },

                handlePressEnd(lane) {
                    const laneEl = document.getElementById(`lane-${lane}`);
                    if (laneEl) laneEl.classList.remove('active-tap');
                    if (this.pressTimestamps[lane] === null) return;
                    const currentTime = window.GameAudio ? window.GameAudio.getCurrentTimeMs() : Date.now();

                    if (this.currentMode === 'record') {
                        const startTime = this.pressTimestamps[lane];
                        if (currentTime - startTime >= 500) {
                            this.recordEvaluatedNote(lane, startTime, 'tap');
                            this.recordEvaluatedNote(lane, currentTime, 'slide');
                        } else {
                            this.recordEvaluatedNote(lane, startTime, 'tap');
                        }
                    } else if (this.currentMode === 'play') {
                        this.judgeOnRelease(lane, currentTime);
                    }
                    this.pressTimestamps[lane] = null;
                },

                recordEvaluatedNote(lane, targetTime, type) {
                    if (!window.GameAudio || !window.GameAudio.isRecording) return;
                    const isDuplicate = window.GameAudio.notesData.some(n => n.lane === lane && Math.abs(n.time - targetTime) < 50);
                    if (!isDuplicate) {
                        window.GameAudio.notesData.push({ time: targetTime, lane: lane, type: type, judged: false });
                        window.GameAudio.notesData.sort((a, b) => a.time - b.time);
                        if (window.GameVisuals) window.GameVisuals.updateTimeline();
                    }
                },

                switchMode(mode) {
                    this.currentMode = mode;
                    document.getElementById('btn-mode-play').classList.remove('active');
                    document.getElementById('btn-mode-record').classList.remove('active');
                    document.getElementById('btn-mode-edit').classList.remove('active');
                    document.getElementById('editor-panel').classList.add('hidden');
                    document.getElementById('combo-display').classList.add('hidden');
                    if (window.GameAudio) window.GameAudio.isRecording = false;

                    if (mode === 'play') {
                        document.getElementById('btn-mode-play').classList.add('active');
                        document.getElementById('combo-display').classList.remove('hidden');
                        this.resetLive();
                    } else if (mode === 'record') {
                        document.getElementById('btn-mode-record').classList.add('active');
                        if (window.GameAudio) window.GameAudio.isRecording = true;
                    } else if (mode === 'edit') {
                        document.getElementById('btn-mode-edit').classList.add('active');
                        document.getElementById('editor-panel').classList.remove('hidden');
                        if (window.GameVisuals) window.GameVisuals.updateTimeline();
                    }
                },

                resetLive() {
                    this.score = 0; this.combo = 0; this.maxCombo = 0;
                    this.counts = { perfect: 0, great: 0, good: 0, miss: 0 };
                    this.isResultShown = false;
                    document.getElementById('score-display').textContent = 'SCORE: 0000000';
                    document.getElementById('combo-display').textContent = '0 COMBO';
                    document.getElementById('judgment-display').textContent = '';
                    if (window.GameAudio && window.GameAudio.notesData) {
                        window.GameAudio.notesData.forEach(n => { n.judged = false; n.holdStarted = false; });
                    }
                },

                addScore(rating) {
                    if (!window.GameAudio || !window.GameAudio.notesData || window.GameAudio.notesData.length === 0) return;
                    const totalNotes = window.GameAudio.notesData.length;
                    const baseNoteScore = 900000 / totalNotes;
                    const comboBonusUnit = 100000 / totalNotes;

                    let rateMultiplier = 0;
                    if (rating === 'PERFECT') { rateMultiplier = 1.0; this.counts.perfect++; }
                    else if (rating === 'GREAT') { rateMultiplier = 0.7; this.counts.great++; }
                    else if (rating === 'GOOD') { rateMultiplier = 0.4; this.counts.good++; }
                    else if (rating === 'MISS') { rateMultiplier = 0.0; this.counts.miss++; }

                    if (rating !== 'MISS') {
                        this.combo++;
                        if (this.combo > this.maxCombo) this.maxCombo = this.combo;
                        this.score += (baseNoteScore * rateMultiplier) + (comboBonusUnit * (this.combo / totalNotes));
                    } else {
                        this.combo = 0;
                    }
                    const displayScore = Math.min(1000000, Math.floor(this.score));
                    document.getElementById('score-display').textContent = `SCORE: ${String(displayScore).padStart(7, '0')}`;
                },

                judgeOnPress(lane, currentTime) {
                    if (!window.GameAudio || !window.GameAudio.notesData) return;
                    const targetNote = window.GameAudio.notesData.find(n => n.lane === lane && !n.judged && n.type === 'tap' && Math.abs(n.time - currentTime) <= this.judgments.miss);
                    if (!targetNote) return;

                    const rating = this.calculateRating(targetNote.time, currentTime);
                    targetNote.judged = true;
                    this.addScore(rating);

                    if (rating !== 'MISS') {
                        const hasEndNote = window.GameAudio.notesData.some(n => n.lane === lane && n.type === 'slide' && n.time > targetNote.time && !n.judged);
                        if (hasEndNote) targetNote.holdStarted = true;
                    }
                    this.displayJudgment(rating, this.getRatingClass(rating));
                },

                judgeOnRelease(lane, currentTime) {
                    const pairs = this.getLongNotePairs();
                    const activePair = pairs.find(p => p.start.lane === lane && p.start.holdStarted && !p.end.judged);
                    if (!activePair) return;

                    const rating = this.calculateRating(activePair.end.time, currentTime);
                    activePair.end.judged = true;
                    activePair.start.holdStarted = false; 
                    this.addScore(rating);
                    this.displayJudgment(rating, this.getRatingClass(rating));
                },

                calculateRating(targetTime, currentTime) {
                    const diff = Math.abs(targetTime - currentTime);
                    if (diff <= this.judgments.perfect) return 'PERFECT';
                    if (diff <= this.judgments.great) return 'GREAT';
                    if (diff <= this.judgments.good) return 'GOOD';
                    return 'MISS';
                },

                getRatingClass(rating) {
                    if (rating === 'PERFECT') return 'jd-perfect';
                    if (rating === 'GREAT') return 'jd-great';
                    if (rating === 'GOOD') return 'jd-good';
                    return 'jd-miss';
                },

                displayJudgment(text, className) {
                    const display = document.getElementById('judgment-display');
                    const comboDisplay = document.getElementById('combo-display');
                    if (display) {
                        display.textContent = text; display.className = className;
                        display.style.transform = 'scale(1.2)';
                        setTimeout(() => display.style.transform = 'scale(1.0)', 50);
                    }
                    if (comboDisplay) comboDisplay.textContent = `${this.combo} COMBO`;
                },

                getLongNotePairs() {
                    if (!window.GameAudio || !window.GameAudio.notesData) return [];
                    const pairs = [];
                    const notes = window.GameAudio.notesData;
                    for (let i = 0; i < notes.length; i++) {
                        if (notes[i].type === 'tap') {
                            const endNote = notes.find((n, idx) => idx > i && n.lane === notes[i].lane && n.type === 'slide');
                            if (endNote && (endNote.time - notes[i].time >= 450)) {
                                pairs.push({ start: notes[i], end: endNote });
                            }
                        }
                    }
                    return pairs;
                },

                startGameLoop() {
                    const loop = () => {
                        if (this.currentMode === 'play') {
                            this.checkLiveHoldNotes(); 
                            this.renderNotes();
                            this.checkMissedNotes();
                            this.checkGameClearOrEnd();
                        }
                        requestAnimationFrame(loop);
                    };
                    requestAnimationFrame(loop);
                },

                checkLiveHoldNotes() {
                    if (!window.GameAudio || !window.GameAudio.notesData) return;
                    const currentTime = window.GameAudio.getCurrentTimeMs();
                    const pairs = this.getLongNotePairs();

                    pairs.forEach(pair => {
                        if (currentTime > pair.start.time && currentTime < pair.end.time - this.judgments.miss) {
                            if (pair.start.holdStarted && !pair.end.judged) {
                                if (!this.isKeyHolding[pair.start.lane]) {
                                    pair.start.holdStarted = false; pair.end.judged = true;
                                    this.addScore('MISS'); this.displayJudgment('MISS', 'jd-miss');
                                }
                            }
                        }
                        if (currentTime > pair.end.time + this.judgments.miss && !pair.end.judged) {
                            pair.end.judged = true; pair.start.holdStarted = false;
                            this.addScore('MISS'); this.displayJudgment('MISS', 'jd-miss');
                        }
                    });
                },

                checkGameClearOrEnd() {
                    if (this.isResultShown || !window.GameAudio || !window.GameAudio.notesData || window.GameAudio.notesData.length === 0) return;
                    const allJudged = window.GameAudio.notesData.every(n => n.judged);
                    let isVideoEnded = false;
                    if (window.GameAudio.player && typeof window.GameAudio.player.getPlayerState === 'function') {
                        isVideoEnded = (window.GameAudio.player.getPlayerState() === 0);
                    }
                    if (allJudged || isVideoEnded) {
                        this.isResultShown = true;
                        setTimeout(() => this.showResultScreen(), 1000);
                    }
                },

                showResultScreen() {
                    const finalScore = Math.min(1000000, Math.floor(this.score));
                    let rank = 'D';
                    if (finalScore >= 980000) rank = 'SSS';
                    else if (finalScore >= 950000) rank = 'SS';
                    else if (finalScore >= 900000) rank = 'S';
                    else if (finalScore >= 800000) rank = 'A';
                    else if (finalScore >= 700000) rank = 'B';
                    else if (finalScore >= 600000) rank = 'C';

                    alert(`【 LIVE RESULT 】\n-----------\nRANK : ${rank}\nSCORE: ${finalScore.toLocaleString()}\n\nPERFECT : ${this.counts.perfect}\nGREAT   : ${this.counts.great}\nGOOD    : ${this.counts.good}\nMISS    : ${this.counts.miss}\n\nMAX COMBO: ${this.maxCombo}\n-----------`);
                },

                renderNotes() {
                    if (!window.GameAudio || !window.GameAudio.notesData) return;
                    const currentTime = window.GameAudio.getCurrentTimeMs();
                    const lanesContainer = document.getElementById('game-lanes');
                    if (!lanesContainer) return;
                    
                    lanesContainer.querySelectorAll('.note, .long-note-body').forEach(n => n.remove());
                    const laneHeight = lanesContainer.clientHeight;
                    const targetY = laneHeight * 0.85; 

                    // 帯描画
                    this.getLongNotePairs().forEach(pair => {
                        if (pair.end.judged) return;
                        const startTimeDiff = pair.start.time - currentTime;
                        const endTimeDiff = pair.end.time - currentTime;

                        if (startTimeDiff <= this.noteSpeedMs && endTimeDiff >= -200) {
                            let yStart = targetY * Math.pow(Math.max(0, 1 - (startTimeDiff / this.noteSpeedMs)), 1.5);
                            let yEnd = targetY * Math.pow(Math.max(0, 1 - (endTimeDiff / this.noteSpeedMs)), 1.5);
                            if (currentTime > pair.start.time && pair.start.holdStarted) yStart = targetY;

                            const bodyHeight = yStart - yEnd;
                            if (bodyHeight > 0) {
                                const bodyEl = document.createElement('div');
                                bodyEl.className = 'long-note-body';
                                bodyEl.style.top = `${yEnd}px`; bodyEl.style.height = `${bodyHeight}px`;
                                if (pair.start.holdStarted) {
                                    bodyEl.style.background = 'linear-gradient(to bottom, #ffee00, #ffaa00)';
                                    bodyEl.style.boxShadow = '0 0 15px #ffee00';
                                }
                                const laneEl = document.getElementById(`lane-${pair.start.lane}`);
                                if (laneEl) laneEl.appendChild(bodyEl);
                            }
                        }
                    });

                    // 単発/ノーツ描画
                    window.GameAudio.notesData.forEach(note => {
                        if (note.judged) return;
                        const timeDiff = note.time - currentTime;
                        if (timeDiff <= this.noteSpeedMs && timeDiff >= -200) {
                            const yPosition = targetY * Math.pow(1 - (timeDiff / this.noteSpeedMs), 1.5);
                            const noteEl = document.createElement('div');
                            noteEl.className = `note note-${note.type}`;
                            noteEl.style.top = `${yPosition}px`;
                            const laneEl = document.getElementById(`lane-${note.lane}`);
                            if (laneEl) laneEl.appendChild(noteEl);
                        }
                    });
                },

                checkMissedNotes() {
                    if (!window.GameAudio || !window.GameAudio.notesData) return;
                    const currentTime = window.GameAudio.getCurrentTimeMs();
                    window.GameAudio.notesData.forEach(n => {
                        if (!n.judged && n.type === 'tap' && (currentTime - n.time) > this.judgments.miss) {
                            n.judged = true; this.addScore('MISS'); this.displayJudgment('MISS', 'jd-miss');
                        }
                    });
                }
            };
            window.GameCore.init();
        }

        /* ==========================================
           【エディタ管理機構 (GameVisuals)】
           ========================================== */
        if (typeof window.GameVisuals === 'undefined') {
            window.GameVisuals = {
                updateTimeline() {
                    const container = document.getElementById('timeline-container');
                    if (!container) return; container.innerHTML = ''; 
                    if (!window.GameAudio || !window.GameAudio.notesData || window.GameAudio.notesData.length === 0) return;

                    const wrapper = document.createElement('div');
                    wrapper.style = 'display:flex; gap:15px; padding:10px; width:max-content;';

                    window.GameAudio.notesData.forEach((note, index) => {
                        const item = document.createElement('div');
                        item.style = `background:#2a2e45; border:2px solid ${note.type === 'slide' ? '#ffee00' : '#00ffff'}; padding:8px; border-radius:4px; text-align:center; min-width:90px;`;
                        item.innerHTML = `
                            <div style="font-size:11px; color:#aaa;">LANE:${note.lane}</div>
                            <input type="number" value="${note.time}" style="width:75px; background:#111; color:#fff; border:1px solid #555; text-align:center; font-size:12px; margin:4px 0;" data-index="${index}">
                            <button style="padding:2px 6px; font-size:10px; background:#cc0000; border:none; color:#fff;" onclick="window.GameVisuals.deleteNote(${index})">削除</button>
                        `;
                        item.querySelector('input').addEventListener('change', (e) => {
                            const idx = parseInt(e.target.getAttribute('data-index'));
                            window.GameAudio.notesData[idx].time = parseInt(e.target.value);
                            window.GameAudio.notesData.sort((a, b) => a.time - b.time);
                            setTimeout(() => window.GameVisuals.updateTimeline(), 500);
                        });
                        wrapper.appendChild(item);
                    });
                    container.appendChild(wrapper);
                },
                deleteNote(index) {
                    if (window.GameAudio && window.GameAudio.notesData) {
                        window.GameAudio.notesData.splice(index, 1); this.updateTimeline();
                    }
                }
            };
        }
    </script>
