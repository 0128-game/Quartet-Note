<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Game Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header id="control-panel">
            <div class="panel-section">
                <input type="text" id="youtube-url" placeholder="YouTube動画のURLを入力">
                <button id="btn-load-video">動画を読み込み</button>
            </div>
            
            <div class="panel-section">
                <button id="btn-mode-play" class="active">プレイモード</button>
                <button id="btn-mode-record">録音（譜面作成）モード</button>
                <button id="btn-mode-edit">調整モード</button>
            </div>

            <div class="panel-section">
                <button id="btn-toggle-bg">プレイヤー: 背景</button>
                <button id="btn-edit-meta">譜面情報を編集</button>
                <button id="btn-export">譜面をエクスポート</button>
                <input type="file" id="file-import" accept=".json" style="display: none;">
                <button id="btn-import-trigger" onclick="document.getElementById('file-import').click()">譜面をインポート</button>
            </div>
        </header>
        <div id="meta-dialog" class="hidden-dialog">
    <div class="dialog-content">
        <h2>楽曲・譜面情報</h2>
        <div class="dialog-body">
            <label>楽曲タイトル: <input type="text" id="meta-title" placeholder="（例）Neoっぽいやつ"></label>
            <label>作者名（譜面制作者）: <input type="text" id="meta-author" placeholder="（例）初音ミク"></label>
            <label>難易度タイプ: 
                <select id="meta-difficulty-type">
                    <option value="EASY">EASY</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="HARD">HARD</option>
                    <option value="EXPERT">EXPERT</option>
                    <option value="MASTER" selected>MASTER</option>
                    <option value="APPEND">APPEND</option> </select>
            </label>
            <label>難易度レベル (1〜46): <input type="number" id="meta-difficulty-level" min="1" max="46" value="30"></label>
            <label>コメント: <textarea id="meta-comment" placeholder="譜面の解説や意気込みなどをどうぞ！"></textarea></label>
        </div>
        <div class="dialog-footer">
            <button id="btn-dialog-close">閉じてゲームへ</button>
        </div>
    </div>
</div>

        <main id="game-area">
            <div id="video-container">
                <div id="youtube-player"></div>
            </div>

            <div id="game-lanes">
                <div class="lane" id="lane-0" data-lane="0">
                    <div class="lane-effect-zone"></div> <div class="lane-key-guide">D</div>
                </div>
                <div class="lane" id="lane-1" data-lane="1">
                    <div class="lane-effect-zone"></div>
                    <div class="lane-key-guide">F</div>
                </div>
                <div class="lane" id="lane-2" data-lane="2">
                    <div class="lane-effect-zone"></div>
                    <div class="lane-key-guide">J</div>
                </div>
                <div class="lane" id="lane-3" data-lane="3">
                    <div class="lane-effect-zone"></div>
                    <div class="lane-key-guide">K</div>
                </div>
                
                <div id="judgment-line"></div>
            </div>

            <div id="ui-overlay">
                <div id="status-display">
                    <div id="score-display">SCORE: <span id="score-val">00000000</span></div>
                    <div id="life-bar-container">
                        <div id="life-bar"></div>
                    </div>
                </div>

                <div id="judgment-center">
                    <div id="judgment-display"></div>
                    <div id="combo-display" class="hidden">00</div>
                </div>
            </div>
        </main>

        <footer id="editor-panel" class="hidden">
            <h3>譜面最終調整タイムライン</h3>
            <div id="timeline-container">
                </div>
        </footer>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
